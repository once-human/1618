name: Sync history

# Vercel's free plan runs scheduled jobs once a day. This nudges the history
# store every 15 minutes instead. The endpoint only copies my own public data
# and ignores calls that come too close together, so it needs no secret.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Copy new data into the history store
        run: curl -fsS --max-time 150 https://www.onkaryaglewad.in/api/sync
      # Free Supabase projects nap after a quiet week; this keeps the one that
      # carries "N people here" awake. The key is a public, browser-safe one.
      - name: Keep the realtime project awake
        continue-on-error: true
        run: |
          curl -fsS --max-time 20 -o /dev/null \
            -H "apikey: sb_publishable_LHJMR1AVPMeQe6U9SeJqug_4ZYHUWsz" \
            https://dceiyqtvejyxzpvmcnuj.supabase.co/auth/v1/health
